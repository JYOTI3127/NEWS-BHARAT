name: Full Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 16 * * *'  # 10:00 PM IST (UTC 16:30)
  workflow_dispatch:
  repository_dispatch:
    types:
      - rebuild-frontend

concurrency:
  group: ${{ github.event_name == 'push' && format('full-build-push-{0}', github.ref) || 'full-build' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clear Vite cache
        run: rm -rf node_modules/.vite

      - name: Build with prerender
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push detected - running full prerender build"
            npm run build
          else
            echo "Schedule/dispatch detected — running full prerender build"
            npm run build
          fi
        env:
          CI: "true"
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Keep server-managed files out of deploy
        run: |
          rm -f build/.htaccess
          rm -f build/robots.txt

      - name: Deploy build output to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          local-dir: build/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          exclude: |
            **/.htaccess
            **/robots.txt
