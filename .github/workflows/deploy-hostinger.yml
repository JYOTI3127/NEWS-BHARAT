name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - article-published
      - article-updated
      - rebuild-frontend

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Log trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "dispatch_type=${{ github.event.action }}"
          echo 'client_payload=${{ toJson(github.event.client_payload) }}'

      - name: Build and prerender
        run: npm run build
        env:
          CI: "true"
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Deploy build output to Hostinger (attempt 1)
        id: hostinger_deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          security: loose
          timeout: 120000
          log-level: standard
          local-dir: ./build/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy build output to Hostinger (attempt 2)
        if: steps.hostinger_deploy_attempt_1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          security: loose
          timeout: 120000
          log-level: standard
          local-dir: ./build/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Note deploy retry
        if: steps.hostinger_deploy_attempt_1.outcome == 'failure'
        run: |
          echo "First Hostinger deploy attempt failed, so a retry was triggered."
