name: Full Build and Deploy to Hostinger

on:
  schedule:
    - cron: '30 16 * * *'  # 10:00 PM IST (UTC 16:30)
  workflow_dispatch:
  repository_dispatch:
    types:
      - rebuild-frontend

concurrency:
  group: full-build
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clear Vite cache
        run: rm -rf node_modules/.vite

      - name: Build and prerender
        run: npm run build
        env:
          CI: "true"
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Keep server-managed files out of deploy
        run: |
          rm -f build/.htaccess
          rm -f build/robots.txt

      - name: Ensure Hostinger target directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 20m
          script: |
            set -e
            TARGET_DIR="${{ secrets.HOSTINGER_SSH_TARGET_DIR }}"
            mkdir -p "$TARGET_DIR"
            rm -f "$TARGET_DIR/sitemap.xml"
            rm -f "$TARGET_DIR/sitemap_index.xml"
            rm -f "$TARGET_DIR/sitemap-articles.xml"
            rm -f "$TARGET_DIR/sitemap-news.xml"
            rm -f "$TARGET_DIR/sitemap-categories.xml"
            rm -f "$TARGET_DIR/sitemap-static.xml"

      - name: Deploy build output to Hostinger over SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "build/*"
          target: ${{ secrets.HOSTINGER_SSH_TARGET_DIR }}
          strip_components: 1
          overwrite: true
          tar_dereference: true
          timeout: 120s
          command_timeout: 20m

      - name: Bust asset cache
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 20m
          script: |
            touch "${{ secrets.HOSTINGER_SSH_TARGET_DIR }}/index.html"