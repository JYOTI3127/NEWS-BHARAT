name: Incremental Article Deploy

on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: 'Article slug (khali chodo = latest article automatic)'
        required: false
        default: ''
  repository_dispatch:
    types:
      - article-published
      - article-updated

concurrency:
  group: incremental-build
  cancel-in-progress: false

jobs:
  incremental-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clear Vite cache
        run: rm -rf node_modules/.vite

      - name: Resolve article slug
        id: resolve_slug
        shell: bash
        run: |
          DISPATCH_SLUG="${{ github.event.client_payload.slug }}"
          MANUAL_SLUG="${{ github.event.inputs.article_slug }}"

          if [ -n "$DISPATCH_SLUG" ]; then
            echo "slug=$DISPATCH_SLUG" >> "$GITHUB_OUTPUT"
            echo "Source: backend dispatch → $DISPATCH_SLUG"
          elif [ -n "$MANUAL_SLUG" ]; then
            echo "slug=$MANUAL_SLUG" >> "$GITHUB_OUTPUT"
            echo "Source: manual input → $MANUAL_SLUG"
          else
            echo "Slug nahi mila — API se latest article fetch kar rahe hain..."
            LATEST_SLUG=$(curl -s "https://news4bharat.cloud/api/articles/?page=1&limit=1" | node -e "
              const chunks = [];
              process.stdin.on('data', c => chunks.push(c));
              process.stdin.on('end', () => {
                try {
                  const data = JSON.parse(chunks.join(''));
                  const articles = Array.isArray(data) ? data : (data.results || []);
                  console.log(articles[0]?.slug || '');
                } catch { console.log(''); }
              });
            ")
            if [ -z "$LATEST_SLUG" ]; then
              echo "ERROR: Koi bhi slug nahi mila!"
              exit 1
            fi
            echo "slug=$LATEST_SLUG" >> "$GITHUB_OUTPUT"
            echo "Source: API latest → $LATEST_SLUG"
          fi

      - name: Build React app (no prerender)
        run: npm run build:vite
        env:
          CI: "true"
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Deploy build shell to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "build/*"
          target: "/home/u243022050/incremental-workspace"
          strip_components: 1
          overwrite: true
          tar_dereference: true
          timeout: 120s
          command_timeout: 10m

      - name: Copy prerender scripts to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "prerender-incremental.mjs,src/lib/articleUrl.js,package.json,package-lock.json"
          target: "/home/u243022050/incremental-workspace"
          overwrite: true
          timeout: 60s
          command_timeout: 5m

      - name: Run prerender ON Hostinger + deploy to public_html
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          timeout: 300s
          command_timeout: 20m
          script: |
            set -e
            WORKSPACE="/home/u243022050/incremental-workspace"
            PUBLIC_HTML="/home/u243022050/domains/news4bharat.com/public_html"
            SLUG="${{ steps.resolve_slug.outputs.slug }}"
            API_TARGET="${{ secrets.VITE_API_TARGET }}"

            echo "=== Step 1: npm install on Hostinger ==="
            cd "$WORKSPACE"
            npm ci --prefer-offline 2>&1 | tail -5

            echo "=== Step 2: Prerender on Hostinger (API accessible here!) ==="
            ARTICLE_SLUG="$SLUG" \
            VITE_API_TARGET="$API_TARGET" \
            node prerender-incremental.mjs

            echo "=== Step 3: Copy prerendered files to public_html ==="
            if [ -d "$WORKSPACE/build-incremental/__prerender" ]; then
              cp -r "$WORKSPACE/build-incremental/__prerender/." "$PUBLIC_HTML/__prerender/"
              echo "✅ __prerender files copied"
            fi

            # Assets bhi update karo (naye hashed files)
            if [ -d "$WORKSPACE/build-incremental/assets" ]; then
              cp -r "$WORKSPACE/build-incremental/assets/." "$PUBLIC_HTML/assets/"
              echo "✅ assets copied"
            fi

            # index.html update karo
            if [ -f "$WORKSPACE/build-incremental/index.html" ]; then
              cp "$WORKSPACE/build-incremental/index.html" "$PUBLIC_HTML/index.html"
              echo "✅ index.html updated"
            fi

            echo "=== Step 4: Cleanup workspace ==="
            rm -rf "$WORKSPACE/build-incremental"
            rm -rf "$WORKSPACE/node_modules"

            echo "=== ✅ Done! Slug: $SLUG ==="

      - name: Ping Google sitemap
        run: |
          curl -sf "https://www.google.com/ping?sitemap=https://news4bharat.com/sitemap.xml" || true
          echo "Sitemap ping done."