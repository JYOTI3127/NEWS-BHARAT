name: Incremental Article Deploy

on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: 'Article slug'
        required: false
        default: ''
  repository_dispatch:
    types:
      - article-published
      - article-updated

concurrency:
  group: incremental-build
  cancel-in-progress: false

jobs:
  incremental-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clear Vite cache
        run: rm -rf node_modules/.vite

      - name: Resolve article slug
        id: resolve_slug
        shell: bash
        run: |
          DISPATCH_SLUG="${{ github.event.client_payload.slug }}"
          MANUAL_SLUG="${{ github.event.inputs.article_slug }}"

          if [ -n "$DISPATCH_SLUG" ]; then
            echo "slug=$DISPATCH_SLUG" >> "$GITHUB_OUTPUT"
            echo "Source: backend dispatch → $DISPATCH_SLUG"
          elif [ -n "$MANUAL_SLUG" ]; then
            echo "slug=$MANUAL_SLUG" >> "$GITHUB_OUTPUT"
            echo "Source: manual input → $MANUAL_SLUG"
          else
            echo "Slug nahi mila — API se latest fetch kar rahe hain..."
            LATEST_SLUG=$(curl -s "https://news4bharat.cloud/api/articles/?page=1&limit=1" | node -e "
              const chunks = [];
              process.stdin.on('data', c => chunks.push(c));
              process.stdin.on('end', () => {
                try {
                  const data = JSON.parse(chunks.join(''));
                  const articles = Array.isArray(data) ? data : (data.results || []);
                  console.log(articles[0]?.slug || '');
                } catch { console.log(''); }
              });
            ")
            if [ -z "$LATEST_SLUG" ]; then
              echo "ERROR: Slug nahi mila!"
              exit 1
            fi
            echo "slug=$LATEST_SLUG" >> "$GITHUB_OUTPUT"
            echo "Source: API latest → $LATEST_SLUG"
          fi

      - name: Build React app (no prerender)
        run: npm run build:vite
        env:
          CI: "true"
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Run incremental prerender (GitHub Actions pe)
        run: node prerender-incremental.mjs
        env:
          ARTICLE_SLUG: ${{ steps.resolve_slug.outputs.slug }}
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Deploy prerendered files to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "build-incremental/__prerender/*"
          target: "/home/u243022050/domains/news4bharat.com/public_html/__prerender/"
          strip_components: 2
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy assets to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "build-incremental/assets/*"
          target: "/home/u243022050/domains/news4bharat.com/public_html/assets/"
          strip_components: 2
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy index.html to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "build-incremental/index.html"
          target: "/home/u243022050/domains/news4bharat.com/public_html/"
          strip_components: 1
          overwrite: true
          timeout: 60s

      - name: Deploy route index.html files to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "build-incremental/**/*.html"
          target: "/home/u243022050/domains/news4bharat.com/public_html/"
          strip_components: 1
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Ping Google sitemap
        run: |
          curl -sf "https://www.google.com/ping?sitemap=https://news4bharat.com/sitemap.xml" || true
          echo "Sitemap ping done."