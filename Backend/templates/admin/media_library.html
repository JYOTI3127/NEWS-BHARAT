{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Media Library — News4Bharat{% endblock %}
{% block content_title %}Media Library{% endblock %}

{% block extrastyle %}
<link rel="stylesheet" href="{% static 'admin/css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="ml-root">

  <!-- Controls -->
  <div class="ml-controls">
    <div class="ml-tab-group">
      <button class="ml-tab active" id="tabPhotos" onclick="mlSwitchTab('photos')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Photos
        <span class="ml-tab-count" id="photoTabCount" style="font-size:10px;opacity:0.7;"></span>
      </button>
      <button class="ml-tab" id="tabVideos" onclick="mlSwitchTab('videos')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2"/>
        </svg>
        Videos
        <span class="ml-tab-count" id="videoTabCount" style="font-size:10px;opacity:0.7;"></span>
      </button>
    </div>

    <div class="ml-count-pill" id="mlCountPill">Loading…</div>

    <div class="ml-spacer"></div>

    <div class="ml-search-wrap">
      <svg class="ml-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input
        type="text"
        class="ml-search"
        id="mlSearch"
        placeholder="Search media…"
        oninput="mlFilterGrid(this.value)"
      >
    </div>
  </div>

  <!-- Stats -->
  <div class="ml-stats" id="mlStats"></div>

  <!-- Grid -->
  <div class="ml-grid-wrap">
    <div class="ml-grid" id="mlGrid">
      {% for i in "123456789012" %}
      <div class="ml-skeleton"></div>
      {% endfor %}
    </div>
  </div>

</div>

<!-- ── LIGHTBOX ── -->
<div class="ml-lightbox" id="mlLightbox">
  <div class="ml-lb-counter" id="mlLbCounter">1 / 1</div>
  <button class="ml-lb-close" onclick="mlLbClose()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    Close
  </button>

  <div style="position:relative;">
    <button class="ml-lb-arrow prev" onclick="mlLbPrev()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="ml-lb-media-wrap" id="mlLbMediaWrap"></div>

    <button class="ml-lb-arrow next" onclick="mlLbNext()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="ml-lb-caption" id="mlLbCaption"></div>
</div>

<script>
(function () {
  var currentTab = 'photos';
  var allItems   = [];
  var filtered   = [];
  var lbIndex    = 0;

  /* ── Escape HTML ── */
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Tab switch ── */
  window.mlSwitchTab = function (tab) {
    currentTab = tab;
    document.getElementById('tabPhotos').classList.toggle('active', tab === 'photos');
    document.getElementById('tabVideos').classList.toggle('active', tab === 'videos');
    document.getElementById('mlSearch').value = '';
    loadMedia(tab);
  };

  /* ── Load media from API ── */
  function loadMedia(tab) {
    var grid = document.getElementById('mlGrid');
    var stats = document.getElementById('mlStats');

    // Skeletons
    grid.innerHTML = '';
    for (var i = 0; i < 12; i++) {
      var sk = document.createElement('div');
      sk.className = 'ml-skeleton';
      grid.appendChild(sk);
    }
    stats.innerHTML = '';
    document.getElementById('mlCountPill').textContent = 'Loading…';

    var url = tab === 'photos' ? '/api/media/photos/' : '/api/media/videos/';

    fetch(url, { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        allItems = data.items || [];
        filtered = allItems.slice();

        var n = allItems.length;
        var label = tab === 'photos' ? (n === 1 ? 'Photo' : 'Photos') : (n === 1 ? 'Video' : 'Videos');
        document.getElementById('mlCountPill').textContent = n + ' ' + label;

        // Update tab counts
        if (tab === 'photos') document.getElementById('photoTabCount').textContent = n ? '(' + n + ')' : '';
        else document.getElementById('videoTabCount').textContent = n ? '(' + n + ')' : '';

        // Stats
        stats.innerHTML =
          '<div class="ml-stat"><strong>' + n + '</strong> total ' + label.toLowerCase() + '</div>';

        renderGrid(filtered, tab);
      })
      .catch(function (err) {
        allItems = [];
        filtered = [];
        document.getElementById('mlCountPill').textContent = '—';
        grid.innerHTML = '<div class="ml-error"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Could not load ' + tab + ': ' + err.message + '</div>';
      });
  }

  /* ── Render grid ── */
  function renderGrid(items, tab) {
    var grid = document.getElementById('mlGrid');
    grid.innerHTML = '';

    if (!items.length) {
      grid.innerHTML = '<div class="ml-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><p>No ' + tab + ' found.</p></div>';
      return;
    }

    items.forEach(function (item, idx) {
      var card = document.createElement('div');
      card.className = 'ml-card';
      card.style.animationDelay = Math.min(idx * 0.04, 0.5) + 's';
      card.title = item.name || '';

      card.onclick = (function (i) { return function () { mlLbOpen(i); }; })(idx);

      if (tab === 'videos') {
        card.innerHTML =
          '<video src="' + esc(item.url) + '" muted preload="metadata"></video>' +
          '<div class="ml-play-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>' +
          '<div class="ml-card-overlay"><span class="ml-card-name">' + esc(item.name || 'Video') + '</span></div>';
      } else {
        card.innerHTML =
          '<img src="' + esc(item.url) + '" alt="' + esc(item.name || 'Photo') + '" loading="lazy">' +
          '<div class="ml-card-overlay"><span class="ml-card-name">' + esc(item.name || 'Photo') + '</span></div>';
      }

      grid.appendChild(card);
    });
  }

  /* ── Search filter ── */
  window.mlFilterGrid = function (q) {
    if (!q.trim()) {
      filtered = allItems.slice();
    } else {
      var lower = q.toLowerCase();
      filtered = allItems.filter(function (item) {
        return (item.name || '').toLowerCase().indexOf(lower) !== -1;
      });
    }
    document.getElementById('mlCountPill').textContent = filtered.length + (currentTab === 'photos' ? ' Photos' : ' Videos');
    renderGrid(filtered, currentTab);
  };

  /* ── Lightbox ── */
  window.mlLbOpen = function (idx) {
    lbIndex = idx;
    document.getElementById('mlLightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
    renderLb();
  };

  window.mlLbClose = function () {
    var v = document.querySelector('#mlLbMediaWrap video');
    if (v) v.pause();
    document.getElementById('mlLightbox').classList.remove('active');
    document.body.style.overflow = '';
  };

  window.mlLbPrev = function () {
    if (!filtered.length) return;
    lbIndex = (lbIndex - 1 + filtered.length) % filtered.length;
    renderLb();
  };

  window.mlLbNext = function () {
    if (!filtered.length) return;
    lbIndex = (lbIndex + 1) % filtered.length;
    renderLb();
  };

  function renderLb() {
    var item  = filtered[lbIndex];
    var total = filtered.length;
    var wrap  = document.getElementById('mlLbMediaWrap');
    var old   = wrap.querySelector('video');
    if (old) old.pause();

    if (currentTab === 'videos') {
      wrap.innerHTML = '<video src="' + esc(item.url) + '" controls autoplay style="max-width:88vw;max-height:78vh;border-radius:10px;"></video>';
    } else {
      wrap.innerHTML = '<img src="' + esc(item.url) + '" alt="' + esc(item.name || '') + '">';
    }

    document.getElementById('mlLbCounter').textContent = (lbIndex + 1) + ' / ' + total;
    document.getElementById('mlLbCaption').textContent = item.name || '';
  }

  /* ── Keyboard nav ── */
  document.addEventListener('keydown', function (e) {
    var lb = document.getElementById('mlLightbox');
    if (!lb.classList.contains('active')) return;
    if (e.key === 'ArrowLeft')  mlLbPrev();
    if (e.key === 'ArrowRight') mlLbNext();
    if (e.key === 'Escape')     mlLbClose();
  });

  /* Click outside media to close */
  document.getElementById('mlLightbox').addEventListener('click', function (e) {
    if (e.target === this) mlLbClose();
  });

  /* ── Init ── */
  loadMedia('photos');

  /* Prefetch video count in background */
  fetch('/api/media/videos/', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var n = (d.items || []).length;
      document.getElementById('videoTabCount').textContent = n ? '(' + n + ')' : '';
    })
    .catch(function () {});

})();
</script>
{% endblock %}
