<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page_title }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #071226;
      --panel: rgba(7, 18, 38, 0.78);
      --line: rgba(148, 163, 184, 0.22);
      --text: #eff6ff;
      --muted: #cbd5e1;
      --accent: #f59e0b;
      --accent-2: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.2), transparent 34%),
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.2), transparent 30%),
        linear-gradient(160deg, #020617, #0f172a 48%, #111827);
    }
    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.52);
      backdrop-filter: blur(14px);
    }
    .title {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.8rem);
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .linkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .linkbox input {
      width: min(420px, 72vw);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.92);
      color: var(--text);
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #08111f;
    }
    #meetingFrame {
      width: 100%;
      min-height: calc(100vh - 93px);
    }
    @media (max-width: 760px) {
      .topbar { padding: 16px; align-items: flex-start; flex-direction: column; }
      .linkbox { width: 100%; justify-content: flex-start; }
      .linkbox input { width: 100%; }
      #meetingFrame { min-height: calc(100vh - 185px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 class="title">{{ meeting_label }}</h1>
        <p class="subtitle">Join directly from your browser. Camera and microphone permissions may be required.</p>
      </div>
      <div class="linkbox">
        <input id="shareMeetingLink" type="text" value="{{ share_url }}" readonly>
        <button class="btn" type="button" onclick="copyMeetingLink()">Copy Link</button>
      </div>
    </header>
    <div id="meetingFrame"></div>
  </div>

  <script src="https://{{ video_conference_domain }}/external_api.js"></script>
  <script>
    function copyMeetingLink() {
      var input = document.getElementById('shareMeetingLink');
      if (!input) return;
      navigator.clipboard.writeText(input.value).catch(function() {
        input.select();
        document.execCommand('copy');
      });
    }

    (function() {
      var domain = "{{ video_conference_domain|escapejs }}";
      var roomName = "{{ room_name|escapejs }}";
      var parentNode = document.getElementById('meetingFrame');
      if (!window.JitsiMeetExternalAPI || !parentNode) {
        parentNode.innerHTML = '<div style="padding:24px;color:#fff;">The meeting could not be loaded. Please refresh the page and try again.</div>';
        return;
      }
      new window.JitsiMeetExternalAPI(domain, {
        roomName: roomName,
        parentNode: parentNode,
        width: '100%',
        height: '100%',
        configOverwrite: {
          prejoinPageEnabled: true
        },
        interfaceConfigOverwrite: {
          MOBILE_APP_PROMO: false
        }
      });
    })();
  </script>
</body>
</html>
