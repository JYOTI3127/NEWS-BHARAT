  <!-- GA: load after first paint/idle so analytics does not compete with LCP resources -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.N4B_GA_ID = 'G-NR6G1PPS6N';
    window.gtag = function gtag() { window.dataLayer.push(arguments); };

    (function () {
      var GA_ID = window.N4B_GA_ID;
      var loaded = false;
      var listenersAttached = false;
      var fallbackTimer = 0;
      var interactionEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll'];

      function loadAnalytics() {
        if (loaded) return;
        loaded = true;
        cleanupListeners();
        window.clearTimeout(fallbackTimer);

        var script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        script.async = true;
        document.head.appendChild(script);

        window.gtag('js', new Date());
        window.gtag('config', GA_ID, { send_page_view: false });
      }

      function cleanupListeners() {
        if (!listenersAttached) return;
        listenersAttached = false;

        interactionEvents.forEach(function (eventName) {
          window.removeEventListener(eventName, loadAnalytics, { passive: true });
        });
      }

      function attachInteractionListeners() {
        if (listenersAttached) return;
        listenersAttached = true;

        interactionEvents.forEach(function (eventName) {
          window.addEventListener(eventName, loadAnalytics, { once: true, passive: true });
        });
      }

      function scheduleAnalytics() {
        attachInteractionListeners();

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(function () {
            fallbackTimer = window.setTimeout(loadAnalytics, 6000);
          }, { timeout: 7000 });
        } else {
          fallbackTimer = window.setTimeout(loadAnalytics, 6000);
        }
      }

      if (document.readyState === 'complete') {
        scheduleAnalytics();
      } else {
        window.addEventListener('load', scheduleAnalytics, { once: true });
      }
    })();
  </script>

  <!-- Canonical and hreflang are injected by prerender per route -->

  <script>
    (function () {
      try {
        var path = window.location.pathname;
        if (path === '/' || path === '') return;

        var ogTitleEl = document.querySelector('meta[property="og:title"]');
        var ogTitle = ogTitleEl && ogTitleEl.getAttribute('content');

        if (
          ogTitle &&
          ogTitle !== 'News4Bharat - India News, Economy, Politics & Explainers' &&
          ogTitle.length > 0
        ) {
          document.title = ogTitle.includes('News4Bharat')
            ? ogTitle
            : ogTitle + ' | News4Bharat';
        }
      } catch (e) {
        // React Helmet handles final titles after hydration.
      }
    })();
  </script>
