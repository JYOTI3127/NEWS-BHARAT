server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep article URLs canonical without trailing slash, then serve the React app.
    location ~ ^/(?!category/|tag/|author/|news/|article/|60-seconds/|assets/)([A-Za-z0-9-]+)/([A-Za-z0-9-]+)/$ {
        return 301 /$1/$2;
    }

    # React app shell for homepage, category pages, static pages, and client routes.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
